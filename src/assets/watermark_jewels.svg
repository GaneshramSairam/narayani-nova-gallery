<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#F8E79C" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer concentric circles -->
    <circle cx="400" cy="400" r="370" stroke-width="4" stroke-dasharray="8 6" />
    <circle cx="400" cy="400" r="350" stroke-width="2" />
    <circle cx="400" cy="400" r="330" stroke-width="1.5" />

    <!-- 16-point Ornate Star / Mandalic rays -->
    <g transform="translate(400, 400)">
      <!-- 8 Diamonds radiating -->
      <g id="ray">
        <path d="M0 -330 L15 -270 L0 -240 L-15 -270 Z" />
        <circle cx="0" cy="-300" r="4" fill="#D4AF37" />
        <line x1="0" y1="-240" x2="0" y2="-190" stroke-dasharray="4 4" />
      </g>
      <use href="#ray" transform="rotate(45)" />
      <use href="#ray" transform="rotate(90)" />
      <use href="#ray" transform="rotate(135)" />
      <use href="#ray" transform="rotate(180)" />
      <use href="#ray" transform="rotate(225)" />
      <use href="#ray" transform="rotate(270)" />
      <use href="#ray" transform="rotate(315)" />

      <!-- Intermediate lotus petal flourishes -->
      <g id="flourish">
        <path d="M0 -220 C25 -250 40 -200 0 -170 C-40 -200 -25 -250 0 -220 Z" />
      </g>
      <use href="#flourish" transform="rotate(22.5)" />
      <use href="#flourish" transform="rotate(67.5)" />
      <use href="#flourish" transform="rotate(112.5)" />
      <use href="#flourish" transform="rotate(157.5)" />
      <use href="#flourish" transform="rotate(202.5)" />
      <use href="#flourish" transform="rotate(247.5)" />
      <use href="#flourish" transform="rotate(292.5)" />
      <use href="#flourish" transform="rotate(337.5)" />

      <!-- Inner concentric ring -->
      <circle cx="0" cy="0" r="160" stroke-width="2.5" />
      <circle cx="0" cy="0" r="145" stroke-dasharray="5 5" />

      <!-- Centerpiece Brilliant-Cut Gemstone / Diamond -->
      <!-- Table facet -->
      <polygon points="0,-120 75,-45 75,45 0,120 -75,45 -75,-45" stroke-width="3" />
      <polygon points="0,-75 45,-30 45,30 0,75 -45,30 -45,-30" stroke-width="2" />
      <!-- Star facets connecting table to crown -->
      <line x1="0" y1="-120" x2="0" y2="-75" />
      <line x1="75" y1="-45" x2="45" y2="-30" />
      <line x1="75" y1="45" x2="45" y2="30" />
      <line x1="0" y1="120" x2="0" y2="75" />
      <line x1="-75" y1="45" x2="-45" y2="30" />
      <line x1="-75" y1="-45" x2="-45" y2="-30" />

      <!-- Culet / Center sparkle -->
      <circle cx="0" cy="0" r="12" fill="#D4AF37" />
      <line x1="-25" y1="0" x2="25" y2="0" stroke-width="2" />
      <line x1="0" y1="-25" x2="0" y2="25" stroke-width="2" />
    </g>

    <!-- Typography: NARAYANI GALLERY -->
    <text x="400" y="605" text-anchor="middle" font-family="'Times New Roman', Georgia, serif" font-size="34" font-weight="bold" fill="url(#goldGrad)" letter-spacing="14" stroke="none">NARAYANI GALLERY</text>
    <text x="400" y="630" text-anchor="middle" font-family="'Times New Roman', Georgia, serif" font-size="14" fill="#E5C978" letter-spacing="8" stroke="none">ROYAL ORNAMENTS</text>
  </g>
</svg>
