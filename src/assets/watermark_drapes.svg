<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="roseGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C978" />
      <stop offset="40%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#C2185B" />
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#roseGoldGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer concentric ring -->
    <circle cx="400" cy="400" r="370" stroke-width="3" stroke-dasharray="10 5" />
    <circle cx="400" cy="400" r="350" stroke-width="2" />

    <!-- Ornate Zari Saree Border Wave running along perimeter -->
    <path d="M 50 400 Q 200 360 400 400 T 750 400" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4" />
    
    <!-- Center Traditional Paisley / Manga / Kalga Motif -->
    <g transform="translate(400, 360)">
      <!-- Main outer paisley shape -->
      <path d="M 0 160 C -120 160 -180 50 -150 -50 C -120 -150 -40 -200 60 -240 C 90 -250 110 -220 90 -200 C 50 -160 0 -90 0 0 C 0 90 70 140 0 160 Z" stroke-width="4" />
      
      <!-- Inner echoing paisley outline -->
      <path d="M 0 135 C -95 135 -145 45 -120 -40 C -95 -125 -30 -165 45 -195 C 65 -202 75 -185 65 -170 C 35 -140 -5 -80 -5 0 C -5 75 50 120 0 135 Z" stroke-width="2" />

      <!-- Silk Pleat lines inside the paisley (flowing saree drape folds) -->
      <path d="M -90 -20 C -70 40 -30 90 0 115" stroke-width="1.8" />
      <path d="M -70 -50 C -45 20 -15 70 5 95" stroke-width="1.8" />
      <path d="M -50 -80 C -25 0 0 50 15 75" stroke-width="1.8" />
      <path d="M -25 -110 C -5 -20 15 30 25 55" stroke-width="1.8" />

      <!-- Ornate Floral Jali Medallion in the heart of the motif -->
      <circle cx="-50" cy="20" r="28" stroke-width="2" />
      <circle cx="-50" cy="20" r="16" stroke-dasharray="3 3" />
      <circle cx="-50" cy="20" r="6" fill="#D4AF37" />

      <!-- Little seed pearls radiating along spine -->
      <circle cx="5" cy="-145" r="5" fill="#D4AF37" />
      <circle cx="25" cy="-170" r="4" fill="#D4AF37" />
      <circle cx="50" cy="-190" r="3" fill="#D4AF37" />

      <!-- Lotus Bloom attached to outer curve -->
      <g transform="translate(-150, -30) rotate(-45)">
        <path d="M 0 0 C -20 -30 0 -50 0 -50 C 0 -50 20 -30 0 0 Z" stroke-width="2" fill="none" />
        <path d="M -5 -5 C -35 -25 -25 -45 -10 -40" stroke-width="1.5" />
        <path d="M 5 -5 C 35 -25 25 -45 10 -40" stroke-width="1.5" />
      </g>
    </g>

    <!-- Typography: NILA DRAPES -->
    <text x="400" y="605" text-anchor="middle" font-family="'Times New Roman', Georgia, serif" font-size="34" font-weight="bold" fill="url(#roseGoldGrad)" letter-spacing="14" stroke="none">NILA DRAPES</text>
    <text x="400" y="630" text-anchor="middle" font-family="'Times New Roman', Georgia, serif" font-size="14" fill="#E5C978" letter-spacing="8" stroke="none">HERITAGE SILKS &amp; WEAVES</text>
  </g>
</svg>
